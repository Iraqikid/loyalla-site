<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Loyalla</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var bareLegalPath = /^\/(privacy|terms)\/?$/i.test(path);
        var bareVenuePath = /^\/venues(?:\/|$)/i.test(path);

        if (bareLegalPath || bareVenuePath) {
          window.location.replace(
            "/en" + path + window.location.search + window.location.hash,
          );
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --cream: #f8f4ea;
        --gold: #b8912f;
        --espresso: #241d12;
        --muted: #6c6254;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(184, 145, 47, 0.14), transparent 31rem),
          var(--cream);
        color: var(--espresso);
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 40px, 760px);
        padding: 64px 24px;
        text-align: center;
      }

      .wordmark {
        display: inline-flex;
        align-items: baseline;
        direction: ltr;
        line-height: 1;
        text-decoration: none;
      }

      .wordmark__lo {
        color: var(--espresso);
        font-size: clamp(2rem, 7vw, 3.25rem);
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .wordmark__yalla {
        margin-left: 0.08em;
        color: var(--gold);
        font-family: "Great Vibes", "Snell Roundhand", cursive;
        font-size: clamp(2.7rem, 9vw, 4.4rem);
        font-weight: 400;
      }

      .rule {
        width: 56px;
        height: 1px;
        margin: 38px auto;
        background: var(--gold);
      }

      .code {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.32em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }

      .english,
      .arabic {
        color: var(--muted);
      }

      .english {
        margin: 18px 0 0;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.7;
      }

      .arabic {
        margin: 22px 0 0;
        font-family: Arial, "Geeza Pro", sans-serif;
        font-size: clamp(1.05rem, 2.8vw, 1.25rem);
        line-height: 1.8;
      }

      .arabic strong {
        display: block;
        color: var(--espresso);
        font-size: 1.2em;
        font-weight: 600;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 38px;
      }

      .button {
        min-width: 168px;
        padding: 13px 22px;
        border: 1px solid var(--gold);
        border-radius: 999px;
        background: var(--gold);
        color: var(--cream);
        font-size: 0.83rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-decoration: none;
        transition: background 180ms ease, color 180ms ease, transform 180ms ease;
      }

      .button--ar {
        background: transparent;
        color: var(--espresso);
        font-family: Arial, "Geeza Pro", sans-serif;
        font-size: 0.95rem;
      }

      .button:hover,
      .button:focus-visible {
        background: var(--espresso);
        border-color: var(--espresso);
        color: var(--cream);
        transform: translateY(-1px);
      }

      .button:focus-visible {
        outline: 3px solid rgba(184, 145, 47, 0.32);
        outline-offset: 3px;
      }

      @media (max-width: 440px) {
        main {
          padding-block: 40px;
        }

        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="wordmark" href="/en/" aria-label="Loyalla home">
        <span class="wordmark__lo">Lo</span><span class="wordmark__yalla">Yalla</span>
      </a>
      <div class="rule" aria-hidden="true"></div>
      <p class="code">ERROR 404</p>
      <h1>Page not found</h1>
      <p class="english">The page you’re looking for may have moved or no longer exists.</p>
      <p class="arabic" lang="ar" dir="rtl">
        <strong>الصفحة غير موجودة</strong>
        ربما تم نقل الصفحة التي تبحث عنها أو لم تعد موجودة.
      </p>
      <div class="actions">
        <a class="button" href="/en/">Back to home</a>
        <a class="button button--ar" href="/ar/" lang="ar" dir="rtl">العودة إلى الرئيسية</a>
      </div>
    </main>
  </body>
</html>
